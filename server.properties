server-name=Netherrack Server
# Used as the server name
# Allowed values: Any string without semicolon symbol

gamemode=survival
# Sets the game mode for new players
# Allowed values: "survival", "creative", or "adventure"

difficulty=normal
# Sets the difficulty of the world
# Allowed values: "peaceful", "easy", "normal", or "hard"

max-players=20
# The maximum number of players that can play on the server
# Allowed values: Any positive integer

online-mode=true
# If true then all connected players must be authenticated to Xbox Live.
# Clients connecting to remote (non-LAN) servers will always require Xbox Live authentication regardless of this setting.
# If the server accepts connections from the Internet, then it's highly recommended to enable online-mode.
# Allowed values: "true" or "false"

server-port=19132
# Which IPv4 port the server should listen to.
# Allowed values: Integers in the range [1, 65535]

server-ip=0.0.0.0
# Which IP address the server should listen on. 0.0.0.0 listens on every address this machine has.
# Allowed values: An IPv4 or IPv6 literal, or empty.

view-distance=32
# The maximum allowed view distance in number of chunks.
# Allowed values: Positive integer equal to 5 or greater.

level-name=Bedrock level
# The name of the level to play on, which is also the name of its folder in worlds. If there's no such level, a new one is created.
# Allowed values: Any string without semicolon symbol or symbols illegal for file name: /\n\r\t\f`?*\\<>|\":


# ///// ///// ///// ///// ///// CUSTOM SERVER PROPERTIES \\\\\ \\\\\ \\\\\ \\\\\ \\\\\ #


default-player-permission-level=member
# Permission level for new players joining for the first time.
# Allowed values: "visitor", "member", "operator"

language=en-US
# The language of the server's own messages in the console. Players see the game in the language they've chosen themselves.
# Allowed values: "en-US" or "pt-BR"

level-type=FLAT
# The type of world to create when the level doesn't exist yet. A level that already exists keeps the type it was created with.
# Allowed values: "flat" (its layers are set by preset-type in netherrack.yml), or "default" for generated terrain (not available yet: until it is, the world stays empty)
# Commenting this out is the same as "default".

op-permission-level=2
# Which commands operators can use: 0 only the ones every player can, 2 adds commands like gamemode, 3 adds op and deop, and 4 adds stop.
# Who is an operator is set in permissions.json, or with the op and deop commands.
# Allowed values: Integers in the range [0, 4]
